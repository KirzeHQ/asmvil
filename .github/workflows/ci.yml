name: CI

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'include/**'
      - 'tests/**'
      - '.github/workflows/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'include/**'
      - 'tests/**'
      - '.github/workflows/**'

jobs:
  build-and-test:
    name: Build & test on ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x86_64
          #- runner: ubuntu-24.04-arm
          #  arch: aarch64
    steps:
      - uses: actions/checkout@v7

      - name: Install just
        uses: extractions/setup-just@v4

      - name: Install rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
          override: true  

      - name: Build
        run: just build

      - name: Test
        run: just test

      # Cache just install
      - name: Cache just install
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/just
          key: just-${{ runner.os }}

      # Cache cargo registry
      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: ~/.cargo/registry
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}